# ~/.tmux.conf on the Mac (copied from dotfiles: mac/tmux.conf)
# The one tmux that organizes the panes of the `dev` layout. Prefix: Ctrl-b.
# (The Codespace shell pane runs its own tmux with prefix Ctrl-q.)

set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB'

# For Claude Code (code.claude.com/docs/en/terminal-config#configure-tmux):
# Shift+Enter and other modified keys, notifications, focus reporting
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Esc reaches programs right away instead of after half a second
set -s escape-time 10

# Programs in any pane (also over SSH) may copy with OSC 52; tmux passes it
# on to Ghostty, which puts it on the Mac clipboard
set -s set-clipboard on

# Click to switch panes, drag borders to resize, wheel to scroll
set -g mouse on
set -g history-limit 50000

# Pane titles (set by `dev`) on the borders
set -g pane-border-lines heavy
set -g pane-active-border-style 'fg=blue'

# Status bar: full session name (= codespace name) on the left, clock on the
# right instead of the pane title, which programs overwrite with escape codes
set -g status-left-length 40
set -g status-left '[#{session_name}] '
set -g status-right ' %H:%M '

# Prefix + R: restart the current pane (reconnects a Codespace pane)
bind R respawn-pane -k \; display-message "Pane restarted"
