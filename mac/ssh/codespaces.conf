# ~/.ssh/config.d/codespaces.conf (copied from dotfiles: mac/ssh/codespaces.conf)
# Included from the top of ~/.ssh/config by mac/install.sh.

# One file per codespace, written by `dev` from `gh codespace ssh --config`
# on every launch. Host names are shortened to cs.<codespace-name>, so they
# stay the same when the branch in the codespace changes.
Include config.d/codespaces/*

# All panes of a codespace share one SSH connection. gh's config sets
# ControlMaster but no ControlPath, which ssh needs for sharing.
Host cs.*
  ControlMaster auto
  ControlPath ~/.ssh/cm/%C
  ControlPersist 10m
  # Notice a dead connection within ~45 s, so panes can reconnect
  ServerAliveInterval 15
  ServerAliveCountMax 3
