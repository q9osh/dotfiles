# ~/.tmux.conf in Codespaces (copied from dotfiles: codespaces/tmux.conf)
#
# Here tmux only keeps the shell pane of the Mac's `dev` layout alive across
# SSH disconnects. The layout itself lives in tmux on the Mac, so this nested
# one stays out of the way: no status bar, and its own prefix (Ctrl-q, press
# twice to send it to the shell) so Ctrl-b keeps going to the Mac tmux.

unbind C-b
set -g prefix C-q
bind C-q send-prefix
set -g status off

set -g default-terminal "tmux-256color"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000

# Wheel scrolls this shell's history; drag-select copies
set -g mouse on

# Copies (and OSC 52 from programs) go to the Mac tmux and on to the Mac
# clipboard. The outer terminal here is the Mac tmux (TERM=tmux-256color).
set -s set-clipboard on
set -as terminal-features 'tmux*:clipboard:RGB'

# (install.sh adds the line for zsh below.)
